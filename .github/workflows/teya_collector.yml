name: Teya Data Collector to Google Drive

on:
  workflow_dispatch:  # Kézi indítás a GitHub felületén
  schedule:
    - cron: '0 6 * * *'  # Minden nap reggel 6:00 UTC-kor automatikusan lefut

jobs:
  run-collector:
    runs-on: ubuntu-latest

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v3

      - name: Python környezet beállítása
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Függőségek telepítése
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl playwright google-api-python-client google-auth-httplib2 google-auth-oauthlib
          playwright install chromium --with-deps

      - name: Teya Gyűjtő futtatása
        env:
          TEYA_EMAIL: ${{ secrets.TEYA_EMAIL }}
          TEYA_PASSWORD: ${{ secrets.TEYA_PASSWORD }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          python main.py
