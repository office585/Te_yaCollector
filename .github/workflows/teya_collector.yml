name: Teya Data Collector to Google Drive

on:
  workflow_dispatch:  # Marad a kézi indítás is, ha épp futtatni akarod
  schedule:
    # A szerverek UTC időzónában vannak. 
    # UTC 05:00 = Magyar idő szerint (CEST) pontosan reggel 07:00 óra.
    - cron: '0 5 * * *'

jobs:
  run-collector:
    runs-on: ubuntu-latest

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v3

      - name: Python környezet beállítása
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Függőségek telepítése
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl playwright google-api-python-client google-auth-httplib2 google-auth-oauthlib
          playwright install chromium --with-deps

      - name: Teya Gyűjtő futtatása
        env:
          TEYA_EMAIL: ${{ secrets.TEYA_EMAIL }}
          TEYA_PASSWORD: ${{ secrets.TEYA_PASSWORD }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          python main.py
